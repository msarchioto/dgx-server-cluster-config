# Example NicClusterPolicy — EDIT before apply (NIC names, deploy flags).
# Docs: NVIDIA Network Operator NicClusterPolicy CRD.
apiVersion: mellanox.com/v1alpha1
kind: NicClusterPolicy
metadata:
  name: nic-cluster-policy
  namespace: network-operator
spec:
  ofedDriver:
    # Set image/version per Network Operator docs if ofedDriver.deploy=true
    startupProbe:
      initialDelaySeconds: 30
    livenessProbe:
      initialDelaySeconds: 30
    readinessProbe:
      initialDelaySeconds: 10
  rdmaSharedDevicePlugin:
    config: |
      {
        "configList": [
          {
            "resourceName": "rdma_shared_device_a",
            "rdmaHcaMax": 63,
            "selectors": {
              "vendors": ["15b3"]
            }
          }
        ]
      }
  secondaryNetwork:
    cniPlugins:
      image: network-operator
    multus:
      image: multus-cni
    ipamPlugin:
      image: whereabouts
