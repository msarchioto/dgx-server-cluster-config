# Optional Cilium Helm values for DGX bare-metal clusters.
# helm repo add cilium https://helm.cilium.io/
# helm install cilium cilium/cilium --version 1.16.4 -n kube-system -f cilium-values.yaml

ipam:
  mode: kubernetes
  operator:
    clusterPoolIPv4PodCIDRList:
      - "192.168.0.0/16"

kubeProxyReplacement: true
k8sServiceHost: "CHANGE_ME.API_ENDPOINT"
k8sServicePort: "6443"

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: false

# Enable for L7 observability / NetworkPolicy
# For multi-node GPU training, ensure the data-plane NIC used for NCCL is
# not disrupted; use hostNetwork for training jobs when appropriate.

operator:
  replicas: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
