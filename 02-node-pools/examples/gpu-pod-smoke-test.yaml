# Minimal GPU smoke test. Apply after GPU Operator reports ready GPUs.
apiVersion: v1
kind: Pod
metadata:
  name: gpu-smoke-test
  namespace: default
  labels:
    app: gpu-smoke-test
spec:
  restartPolicy: Never
  runtimeClassName: nvidia
  priorityClassName: dgx-batch
  nodeSelector:
    node-pool: dgx-gpu
  tolerations:
    - key: nvidia.com/gpu
      operator: Equal
      value: "true"
      effect: NoSchedule
  containers:
    - name: cuda-vector-add
      image: nvcr.io/nvidia/k8s/cuda-sample:vectoradd-cuda12.5.0
      resources:
        limits:
          nvidia.com/gpu: 1
