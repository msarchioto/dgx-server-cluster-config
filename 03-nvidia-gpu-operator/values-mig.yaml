# Helm values overlay: enable MIG so GPUs can be split on request.
#
# Usage (after base install or together):
#   kubectl apply -f manifests/mig-config.yaml
#   helm upgrade --install gpu-operator nvidia/gpu-operator \
#     -n gpu-operator \
#     -f values.yaml \
#     -f values-mig.yaml \
#     --wait
#
# Default strategy is all-disabled: nodes keep full GPUs until you label them.
# See scripts/enable-mig.sh and manifests/README-mig.md.

# mixed = advertise profile-specific resources (nvidia.com/mig-1g.10gb, …)
# single = all instances look like nvidia.com/gpu (only when every GPU has same layout)
mig:
  strategy: mixed

migManager:
  enabled: true
  config:
    name: default-mig-parted-config
    # Do not auto-split the whole cluster; wait for per-node label requests.
    default: all-disabled

# Ensure device plugin is on (inherits rest from values.yaml)
devicePlugin:
  enabled: true

gfd:
  enabled: true
