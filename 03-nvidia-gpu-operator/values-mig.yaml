# Helm overlay: enable MIG so GPUs can be split on request.
#
# Prefer operator/auto-generated per-node configs when available (GPU Operator
# v26.3+). Custom ConfigMap is optional for exotic layouts only.
#
#   kubectl apply -f manifests/mig-config.yaml   # optional custom strategies
#   helm upgrade ... -f values.yaml -f profiles/<profile>.yaml -f values-mig.yaml
#
# Default strategy all-disabled: full GPUs until node labeled.
# Strategy names align with NVIDIA docs: all-disabled, all-1g.10gb, all-balanced, …

mig:
  # mixed: profile-specific resources (nvidia.com/mig-1g.10gb) when split
  strategy: mixed

migManager:
  enabled: true
  config:
    # Use custom ConfigMap if applied; otherwise Operator may use generated
    # <node>-mig-config (v26.3+) with hardware-discovered profiles.
    name: default-mig-parted-config
    default: all-disabled

devicePlugin:
  enabled: true

gfd:
  enabled: true
