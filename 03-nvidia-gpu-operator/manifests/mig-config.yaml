# Optional custom MIG strategies (GPU Operator mig-manager).
#
# GPU Operator v26.3+ can auto-generate per-node ConfigMaps with profiles
# discovered via NVML. Prefer those when available:
#   kubectl get configmap -n gpu-operator | grep mig-config
#
# Apply this file only when you need named custom layouts or older operators
# that use static default-mig-parted-config.
#
# Strategy names align with NVIDIA docs where possible:
#   all-disabled, all-1g.10gb, all-2g.20gb, all-3g.40gb, all-7g.80gb, all-balanced
#
# Validate on hardware: nvidia-smi mig -lgip
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: default-mig-parted-config
  namespace: gpu-operator
  labels:
    app.kubernetes.io/part-of: dgx-server-cluster-config
    app.kubernetes.io/component: mig
data:
  config.yaml: |
    version: v1
    mig-configs:
      all-disabled:
        - devices: all
          mig-enabled: false

      # --- Common H100 / A100-80GB style profiles (confirm with mig -lgip) ---
      all-1g.10gb:
        - devices: all
          mig-enabled: true
          mig-devices:
            "1g.10gb": 7

      all-1g.20gb:
        - devices: all
          mig-enabled: true
          mig-devices:
            "1g.20gb": 4

      all-2g.20gb:
        - devices: all
          mig-enabled: true
          mig-devices:
            "2g.20gb": 3

      all-3g.40gb:
        - devices: all
          mig-enabled: true
          mig-devices:
            "3g.40gb": 2

      all-7g.80gb:
        - devices: all
          mig-enabled: true
          mig-devices:
            "7g.80gb": 1

      all-balanced:
        - devices: all
          mig-enabled: true
          mig-devices:
            "1g.10gb": 2
            "2g.20gb": 1
            "3g.40gb": 1

      # --- A100 40GB style (different memory naming) ---
      all-1g.5gb:
        - devices: all
          mig-enabled: true
          mig-devices:
            "1g.5gb": 7

      all-2g.10gb:
        - devices: all
          mig-enabled: true
          mig-devices:
            "2g.10gb": 3

      all-3g.20gb:
        - devices: all
          mig-enabled: true
          mig-devices:
            "3g.20gb": 2

      all-balanced-40gb:
        - devices: all
          mig-enabled: true
          mig-devices:
            "1g.5gb": 2
            "2g.10gb": 1
            "3g.20gb": 1
