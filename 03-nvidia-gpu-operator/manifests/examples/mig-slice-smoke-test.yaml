# Smoke-test one MIG slice (mixed strategy).
# Edit resource name to match enabled profile (often nvidia.com/mig-1g.10gb).
apiVersion: v1
kind: Pod
metadata:
  name: mig-slice-smoke-test
  namespace: default
  labels:
    app: mig-slice-smoke-test
spec:
  restartPolicy: Never
  runtimeClassName: nvidia
  priorityClassName: dgx-batch
  nodeSelector:
    node-pool: dgx-gpu
    mig-mode: enabled
  tolerations:
    - key: nvidia.com/gpu
      operator: Equal
      value: "true"
      effect: NoSchedule
  containers:
    - name: cuda-vector-add
      image: nvcr.io/nvidia/k8s/cuda-sample:vectoradd-cuda12.5.0
      resources:
        limits:
          nvidia.com/mig-1g.10gb: 1
