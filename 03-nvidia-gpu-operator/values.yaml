# NVIDIA GPU Operator Helm values — base (shared by all profiles).
# Chart: https://docs.nvidia.com/datacenter/cloud-native/gpu-operator/latest/getting-started.html
#
# Pin chart version in scripts (default GPU_OPERATOR_VERSION=v26.3.3).
#
# Always layer a profile:
#   -f values.yaml -f profiles/values-dgx-os.yaml          # DGX OS (recommended on DGX)
#   -f values.yaml -f profiles/values-vanilla-ubuntu.yaml  # bare Ubuntu
# Optional MIG:
#   -f values-mig.yaml
#
# Namespace must allow privileged PSA (see scripts/install-gpu-operator.sh).

operator:
  defaultRuntime: containerd
  runtimeClass: nvidia

# Defaults assume DGX-like host drivers; override with a profile.
driver:
  enabled: false
  rdma:
    enabled: false

toolkit:
  enabled: true

# CDI is the modern injection path (Operator default true on recent charts).
# RuntimeClass "nvidia" remains for explicit pod specs in this repo.
cdi:
  enabled: true

devicePlugin:
  enabled: true

dcgm:
  enabled: true

dcgmExporter:
  enabled: true
  # Turned on when kube-prometheus-stack / Prometheus Operator is present
  # (see 08-observability/). Safe if CRDs missing only after Operator install timing.
  serviceMonitor:
    enabled: true

gfd:
  enabled: true

# Keep MIG manager off in base install to avoid surprise reconfigs.
# Enable with values-mig.yaml when you want on-request splits.
migManager:
  enabled: false

mig:
  strategy: mixed

nodeStatusExporter:
  enabled: true

daemonsets:
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

nfd:
  enabled: true

sandboxWorkloads:
  enabled: false
