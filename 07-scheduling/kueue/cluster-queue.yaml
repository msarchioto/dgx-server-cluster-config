apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: dgx-cluster-queue
spec:
  namespaceSelector: {}
  resourceGroups:
    - coveredResources: ["cpu", "memory", "nvidia.com/gpu"]
      flavors:
        - name: dgx-gpu
          resources:
            # Adjust to fleet size (example: 2×8 GPU nodes)
            - name: cpu
              nominalQuota: "256"
            - name: memory
              nominalQuota: 4Ti
            - name: nvidia.com/gpu
              nominalQuota: "16"
  queueingStrategy: BestEffortFIFO
  preemption:
    reclaimWithinCohort: Never
    withinClusterQueue: Never
