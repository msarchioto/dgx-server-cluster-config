# Multi-node NCCL all-reduce probe (2 nodes × 1 GPU). Run after Network Operator if using RDMA.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nccl-test-script
  namespace: default
data:
  nccl_bench.py: |
    import os, time
    import torch
    import torch.distributed as dist

    def main():
        dist.init_process_group("nccl")
        r, w = dist.get_rank(), dist.get_world_size()
        local = int(os.environ["LOCAL_RANK"])
        torch.cuda.set_device(local)
        dev = torch.device("cuda", local)
        n = 64 * 1024 * 1024 // 4
        t = torch.ones(n, device=dev, dtype=torch.float32)
        for _ in range(5):
            dist.all_reduce(t)
        torch.cuda.synchronize()
        iters = 20
        t0 = time.perf_counter()
        for _ in range(iters):
            dist.all_reduce(t)
        torch.cuda.synchronize()
        dt = (time.perf_counter() - t0) / iters
        size_b = n * 4
        bus = 2.0 * (w - 1) / max(w, 1) * size_b / dt / 1e9
        if r == 0:
            print(f"NCCL allreduce OK world={w} bus_bw_GBps≈{bus:.2f} latency_s={dt:.4f}", flush=True)
        dist.barrier()
        dist.destroy_process_group()

    if __name__ == "__main__":
        main()
---
apiVersion: v1
kind: Service
metadata:
  name: nccl-test
  namespace: default
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: nccl-test
  ports:
    - name: rdzv
      port: 29500
      targetPort: 29500
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nccl-test
  namespace: default
  labels:
    app: nccl-test
spec:
  serviceName: nccl-test
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: nccl-test
  template:
    metadata:
      labels:
        app: nccl-test
    spec:
      runtimeClassName: nvidia
      priorityClassName: dgx-batch
      nodeSelector:
        node-pool: dgx-gpu
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: nccl-test
              topologyKey: kubernetes.io/hostname
      containers:
        - name: nccl
          image: nvcr.io/nvidia/pytorch:24.12-py3
          ports:
            - containerPort: 29500
              name: rdzv
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              export NCCL_DEBUG="${NCCL_DEBUG:-WARN}"
              ORDINAL="${HOSTNAME##*-}"
              torchrun \
                --nnodes=2 \
                --nproc_per_node=1 \
                --node_rank="${ORDINAL}" \
                --rdzv_backend=c10d \
                --rdzv_endpoint=nccl-test-0.nccl-test:29500 \
                --rdzv_id=nccl-test \
                /scripts/nccl_bench.py
              sleep 300
          envFrom:
            - configMapRef:
                name: pytorch-distributed-env
                optional: true
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
      volumes:
        - name: scripts
          configMap:
            name: nccl-test-script
