# Example TRAINING WORKER — default is 1-GPU smoke (safe first run).
# Full DGX node (8 GPUs): apply overlays/full-node-training-patch.yaml via kubectl patch
# or edit resources + NPROC_PER_NODE below.
#
# Prerequisites:
#   kubectl apply -f ../training/training-configmap.yaml
#   kubectl apply -f ../examples/example-scripts-configmap.yaml
#   kubectl apply -f ../../02-node-pools/priority-classes.yaml
#   kubectl apply -f ../../02-node-pools/runtime-class/nvidia.yaml
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: example-training-worker
  namespace: default
  labels:
    app: example-training-worker
    worker-role: training
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: example-training-worker-config
  namespace: default
  labels:
    app: example-training-worker
    worker-role: training
data:
  WORKER_ROLE: "training"
  WORKER_NAME: "example-training-worker"
  NPROC_PER_NODE: "1"
  NNODES: "1"
  TRAIN_EPOCHS: "1"
  TRAIN_BATCH_SIZE: "32"
  CHECKPOINT_DIR: "/checkpoints"
  DATA_DIR: "/data"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: example-training-worker
  namespace: default
  labels:
    app: example-training-worker
    worker-role: training
    workload: training
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: example-training-worker
        worker-role: training
        workload: training
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      serviceAccountName: example-training-worker
      restartPolicy: Never
      runtimeClassName: nvidia
      priorityClassName: dgx-training
      nodeSelector:
        node-pool: dgx-gpu
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: training-worker
          image: nvcr.io/nvidia/pytorch:24.12-py3
          imagePullPolicy: IfNotPresent
          workingDir: /workspace
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              echo "=== example training worker (smoke defaults: 1 GPU) ==="
              nvidia-smi -L || true
              NPROC="${NPROC_PER_NODE:-1}"
              torchrun --standalone --nnodes=1 --nproc_per_node="${NPROC}" \
                /workspace/examples/train_ddp_min.py
              echo "=== training worker finished OK ==="
          envFrom:
            - configMapRef:
                name: pytorch-distributed-env
                optional: true
            - configMapRef:
                name: example-training-worker-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: examples
              mountPath: /workspace/examples
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
      volumes:
        - name: examples
          configMap:
            name: pytorch-example-scripts
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
