# =============================================================================
# Example TRAINING WORKER
# =============================================================================
# Single-node multi-GPU training worker Job for a DGX node.
# Role: run one torchrun DDP process group on all (or N) GPUs of one machine.
#
# Prerequisites:
#   kubectl apply -f ../training/training-configmap.yaml
#   kubectl apply -f ../examples/example-scripts-configmap.yaml
#   kubectl apply -f ../../02-node-pools/priority-classes.yaml
#   kubectl apply -f ../../02-node-pools/runtime-class/nvidia.yaml
#
# Apply:
#   kubectl apply -f example-training-worker.yaml
#
# Observe:
#   kubectl get job,pod -l worker-role=training
#   kubectl logs -f job/example-training-worker -c training-worker
#
# Customize before production:
#   - image tag, NPROC_PER_NODE / nvidia.com/gpu count
#   - command → your train entrypoint
#   - dataset / checkpoint PVC mounts
# =============================================================================
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: example-training-worker
  namespace: default
  labels:
    app: example-training-worker
    worker-role: training
    app.kubernetes.io/part-of: dgx-server-cluster-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: example-training-worker-config
  namespace: default
  labels:
    app: example-training-worker
    worker-role: training
    app.kubernetes.io/part-of: dgx-server-cluster-config
data:
  # Worker identity / job metadata (consume in your training script if useful)
  WORKER_ROLE: "training"
  WORKER_NAME: "example-training-worker"
  # torchrun layout — match resources.limits.nvidia.com/gpu
  NPROC_PER_NODE: "8"
  NNODES: "1"
  # Training hyperparams (examples; replace with your stack)
  TRAIN_EPOCHS: "1"
  TRAIN_BATCH_SIZE: "32"
  TRAIN_LOG_INTERVAL: "10"
  CHECKPOINT_DIR: "/checkpoints"
  DATA_DIR: "/data"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: example-training-worker
  namespace: default
  labels:
    app: example-training-worker
    worker-role: training
    workload: training
    app.kubernetes.io/part-of: dgx-server-cluster-config
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: example-training-worker
        worker-role: training
        workload: training
      annotations:
        # Useful for cluster autoscalers / cost tooling
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      serviceAccountName: example-training-worker
      restartPolicy: Never
      runtimeClassName: nvidia
      priorityClassName: dgx-training
      # Land only on DGX GPU pool
      nodeSelector:
        node-pool: dgx-gpu
        workload: gpu
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      # Prefer exclusive node for full-DGX training (optional but recommended)
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: worker-role
                      operator: In
                      values: ["training", "inference"]
                topologyKey: kubernetes.io/hostname
      containers:
        - name: training-worker
          image: nvcr.io/nvidia/pytorch:24.12-py3
          imagePullPolicy: IfNotPresent
          workingDir: /workspace
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              echo "=== example training worker ==="
              echo "host=$(hostname)  date=$(date -Is)"
              echo "CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-all}"
              nvidia-smi -L || true
              NPROC="${NPROC_PER_NODE:-8}"
              echo "Starting torchrun standalone  nproc_per_node=${NPROC}"
              # Replace train_ddp_min.py with your training entrypoint, e.g.:
              #   train.py --data "${DATA_DIR}" --ckpt "${CHECKPOINT_DIR}"
              torchrun \
                --standalone \
                --nnodes=1 \
                --nproc_per_node="${NPROC}" \
                /workspace/examples/train_ddp_min.py
              echo "=== training worker finished OK ==="
          envFrom:
            - configMapRef:
                name: pytorch-distributed-env
                optional: true
            - configMapRef:
                name: example-training-worker-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            # Full classic DGX (8 GPUs). Scale down for smoke tests (e.g. "1"/"2").
            requests:
              cpu: "32"
              memory: 256Gi
              nvidia.com/gpu: "8"
            limits:
              cpu: "64"
              memory: 512Gi
              nvidia.com/gpu: "8"
          volumeMounts:
            - name: examples
              mountPath: /workspace/examples
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
            # Uncomment when storage is provisioned:
            # - name: dataset
            #   mountPath: /data
            #   readOnly: true
            # - name: checkpoints
            #   mountPath: /checkpoints
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
      volumes:
        - name: examples
          configMap:
            name: pytorch-example-scripts
        # Large /dev/shm helps DataLoader + NCCL
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
        # - name: dataset
        #   persistentVolumeClaim:
        #     claimName: pytorch-dataset
        # - name: checkpoints
        #   persistentVolumeClaim:
        #     claimName: pytorch-checkpoints
