# Single-node DDP — default 1 GPU smoke. For full node see workers/overlays/.
apiVersion: batch/v1
kind: Job
metadata:
  name: pytorch-ddp-single
  namespace: default
  labels:
    app: pytorch-ddp-single
    workload: training
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: pytorch-ddp-single
        workload: training
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      priorityClassName: dgx-training
      nodeSelector:
        node-pool: dgx-gpu
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: pytorch
          image: nvcr.io/nvidia/pytorch:24.12-py3
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              NPROC="${NPROC_PER_NODE:-1}"
              torchrun --standalone --nnodes=1 --nproc_per_node="${NPROC}" \
                /workspace/examples/train_ddp_min.py
          envFrom:
            - configMapRef:
                name: pytorch-distributed-env
          env:
            - name: NPROC_PER_NODE
              value: "1"
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: examples
              mountPath: /workspace/examples
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
      volumes:
        - name: examples
          configMap:
            name: pytorch-example-scripts
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
