# Multi-node DDP via Kubernetes JobSet (stable per-replica DNS).
# Requires JobSet CRD: https://jobset.sigs.k8s.io/
#
# Install JobSet (once per cluster):
#   kubectl apply --server-side -f \
#     https://github.com/kubernetes-sigs/jobset/releases/download/v0.7.3/manifests.yaml
#
# Apply:
#   kubectl apply -f training-configmap.yaml
#   kubectl apply -f ../examples/example-scripts-configmap.yaml
#   kubectl apply -f multi-node-jobset.yaml
#
# Default: 2 workers × 1 GPU (smoke). Full node: see overlays/full-node-jobset-patch.yaml
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: pytorch-ddp-jobset
  namespace: default
  labels:
    app: pytorch-ddp-jobset
    workload: training
spec:
  failurePolicy:
    maxRestarts: 0
  replicatedJobs:
    - name: workers
      replicas: 1
      template:
        spec:
          parallelism: 2
          completions: 2
          completionMode: Indexed
          backoffLimit: 0
          template:
            metadata:
              labels:
                app: pytorch-ddp-jobset
                workload: training
            spec:
              runtimeClassName: nvidia
              priorityClassName: dgx-training
              restartPolicy: Never
              nodeSelector:
                node-pool: dgx-gpu
              tolerations:
                - key: nvidia.com/gpu
                  operator: Equal
                  value: "true"
                  effect: NoSchedule
              affinity:
                podAntiAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    - labelSelector:
                        matchLabels:
                          app: pytorch-ddp-jobset
                      topologyKey: kubernetes.io/hostname
              containers:
                - name: pytorch
                  image: nvcr.io/nvidia/pytorch:24.12-py3
                  command: ["/bin/bash", "-lc"]
                  args:
                    - |
                      set -euo pipefail
                      # JobSet injects JOB_COMPLETION_INDEX; headless service DNS:
                      #   pytorch-ddp-jobset-workers-<job-index>-<pod-index>.pytorch-ddp-jobset
                      NNODES=2
                      NPROC="${NPROC_PER_NODE:-1}"
                      NODE_RANK="${JOB_COMPLETION_INDEX}"
                      # JobSet stable network: <jobset>-<replicatedJob>-<jobIndex>-<podIndex>
                      RDZV_HOST="pytorch-ddp-jobset-workers-0-0.pytorch-ddp-jobset"
                      echo "node_rank=${NODE_RANK} rdzv=${RDZV_HOST}"
                      torchrun \
                        --nnodes="${NNODES}" \
                        --nproc_per_node="${NPROC}" \
                        --node_rank="${NODE_RANK}" \
                        --rdzv_backend=c10d \
                        --rdzv_endpoint="${RDZV_HOST}:29500" \
                        --rdzv_id=pytorch-ddp-jobset \
                        /workspace/examples/train_ddp_min.py
                  envFrom:
                    - configMapRef:
                        name: pytorch-distributed-env
                  env:
                    - name: NPROC_PER_NODE
                      value: "1"
                  resources:
                    requests:
                      cpu: "4"
                      memory: 16Gi
                      nvidia.com/gpu: "1"
                    limits:
                      cpu: "8"
                      memory: 32Gi
                      nvidia.com/gpu: "1"
                  volumeMounts:
                    - name: examples
                      mountPath: /workspace/examples
                      readOnly: true
                    - name: dshm
                      mountPath: /dev/shm
                  securityContext:
                    capabilities:
                      add: ["IPC_LOCK"]
              volumes:
                - name: examples
                  configMap:
                    name: pytorch-example-scripts
                - name: dshm
                  emptyDir:
                    medium: Memory
                    sizeLimit: 8Gi
