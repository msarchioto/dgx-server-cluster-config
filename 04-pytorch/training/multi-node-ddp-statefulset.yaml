# Multi-node DDP via StatefulSet + headless Service (stable DNS).
# Default: 2 nodes × 1 GPU smoke. Full node: set replicas, NNODES, NPROC, GPU count.
---
apiVersion: v1
kind: Service
metadata:
  name: pytorch-ddp-sts
  namespace: default
  labels:
    app: pytorch-ddp-sts
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: pytorch-ddp-sts
  ports:
    - name: rdzv
      port: 29500
      targetPort: 29500
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pytorch-ddp-sts
  namespace: default
  labels:
    app: pytorch-ddp-sts
    workload: training
spec:
  serviceName: pytorch-ddp-sts
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: pytorch-ddp-sts
  template:
    metadata:
      labels:
        app: pytorch-ddp-sts
        workload: training
    spec:
      runtimeClassName: nvidia
      priorityClassName: dgx-training
      terminationGracePeriodSeconds: 30
      nodeSelector:
        node-pool: dgx-gpu
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: pytorch-ddp-sts
              topologyKey: kubernetes.io/hostname
      containers:
        - name: pytorch
          image: nvcr.io/nvidia/pytorch:24.12-py3
          imagePullPolicy: IfNotPresent
          ports:
            - name: rdzv
              containerPort: 29500
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              NNODES="${NNODES:-2}"
              NPROC="${NPROC_PER_NODE:-1}"
              ORDINAL="${HOSTNAME##*-}"
              RDZV_HOST="pytorch-ddp-sts-0.pytorch-ddp-sts"
              torchrun \
                --nnodes="${NNODES}" \
                --nproc_per_node="${NPROC}" \
                --node_rank="${ORDINAL}" \
                --rdzv_backend=c10d \
                --rdzv_endpoint="${RDZV_HOST}:29500" \
                --rdzv_id=pytorch-ddp-sts \
                /workspace/examples/train_ddp_min.py
              echo "done; sleeping for log collection"
              sleep 3600
          envFrom:
            - configMapRef:
                name: pytorch-distributed-env
          env:
            - name: NNODES
              value: "2"
            - name: NPROC_PER_NODE
              value: "1"
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: examples
              mountPath: /workspace/examples
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
      volumes:
        - name: examples
          configMap:
            name: pytorch-example-scripts
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
