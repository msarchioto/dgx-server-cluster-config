# Multi-node DDP via Indexed Job + headless Service.
#
# How the master / rank-0 node is identified:
#   - completionMode: Indexed → JOB_COMPLETION_INDEX = 0,1,... and
#     Pod hostname = $(job-name)-$(index)  (Kubernetes sets this)
#   - With subdomain + headless Service, DNS is:
#       pytorch-ddp-multi-0.pytorch-ddp-multi
#   - torchrun --node_rank=$JOB_COMPLETION_INDEX
#   - --rdzv_endpoint always points at index 0 (rendezvous + typically global rank 0)
#
# Default: 2 nodes × 1 GPU (smoke). Raise parallelism, NNODES, NPROC, GPUs for real runs.
#
# Prefer StatefulSet (stable ordinals) or JobSet if you already use those CRDs;
# this Job is valid without extra operators.
---
apiVersion: v1
kind: Service
metadata:
  name: pytorch-ddp-multi
  namespace: default
  labels:
    app: pytorch-ddp-multi
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: pytorch-ddp-multi
  ports:
    - name: rdzv
      port: 29500
      targetPort: 29500
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pytorch-ddp-multi
  namespace: default
  labels:
    app: pytorch-ddp-multi
    workload: training
spec:
  parallelism: 2
  completions: 2
  completionMode: Indexed
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: pytorch-ddp-multi
        workload: training
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      priorityClassName: dgx-training
      # Enables DNS: <hostname>.pytorch-ddp-multi.<ns>.svc.cluster.local
      # hostname is set by the Job controller to pytorch-ddp-multi-<index>
      subdomain: pytorch-ddp-multi
      nodeSelector:
        node-pool: dgx-gpu
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: pytorch-ddp-multi
              topologyKey: kubernetes.io/hostname
      containers:
        - name: pytorch
          image: nvcr.io/nvidia/pytorch:24.12-py3
          imagePullPolicy: IfNotPresent
          ports:
            - name: rdzv
              containerPort: 29500
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              NNODES="${NNODES:-2}"
              NPROC="${NPROC_PER_NODE:-1}"
              # Indexed Job: 0 .. nnodes-1 (master / rdzv node is 0)
              NODE_RANK="${JOB_COMPLETION_INDEX:?JOB_COMPLETION_INDEX not set — need completionMode: Indexed}"
              # K8s sets hostname to <job-name>-<index>; headless Service + subdomain → DNS
              RDZV_HOST="${RDZV_HOST:-pytorch-ddp-multi-0.pytorch-ddp-multi}"
              RDZV_PORT="${RDZV_PORT:-29500}"
              echo "hostname=$(hostname) node_rank=${NODE_RANK} nnodes=${NNODES} rdzv=${RDZV_HOST}:${RDZV_PORT}"
              torchrun \
                --nnodes="${NNODES}" \
                --nproc_per_node="${NPROC}" \
                --node_rank="${NODE_RANK}" \
                --rdzv_backend=c10d \
                --rdzv_endpoint="${RDZV_HOST}:${RDZV_PORT}" \
                --rdzv_id=pytorch-ddp-multi \
                /workspace/examples/train_ddp_min.py
          envFrom:
            - configMapRef:
                name: pytorch-distributed-env
          env:
            - name: NNODES
              value: "2"
            - name: NPROC_PER_NODE
              value: "1"
            - name: RDZV_HOST
              value: "pytorch-ddp-multi-0.pytorch-ddp-multi"
            - name: RDZV_PORT
              value: "29500"
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: examples
              mountPath: /workspace/examples
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
      volumes:
        - name: examples
          configMap:
            name: pytorch-example-scripts
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
