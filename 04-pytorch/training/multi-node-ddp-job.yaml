# =============================================================================
# DEPRECATED — do not use for multi-node training.
# =============================================================================
# Indexed Jobs do not provide StatefulSet-style stable DNS (job-0.svc).
# Rendezvous endpoints like pytorch-ddp-multi-0.pytorch-ddp-multi are unreliable.
#
# Use instead:
#   - multi-node-ddp-statefulset.yaml  (stable pod DNS)
#   - multi-node-jobset.yaml           (Kubernetes JobSet, if CRD installed)
#   - Kubeflow Training Operator PyTorchJob (optional)
#
# This file is kept only as a pointer so old links fail loudly.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: DEPRECATED-multi-node-ddp-job
  namespace: default
  labels:
    deprecated: "true"
data:
  message: |
    multi-node-ddp-job.yaml is deprecated.
    Apply multi-node-ddp-statefulset.yaml or multi-node-jobset.yaml instead.
    See 04-pytorch/README.md
