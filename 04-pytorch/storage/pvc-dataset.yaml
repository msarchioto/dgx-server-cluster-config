# Prefer 06-storage/examples/ for concrete StorageClasses.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pytorch-dataset
  namespace: default
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: dgx-nfs  # or dgx-local-path for lab RWO
  resources:
    requests:
      storage: 2Ti
